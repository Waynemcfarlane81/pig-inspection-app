name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          bash android-custom/apply.sh
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/PigInspection-v2.0.${{ github.run_number }}.apk"

      - name: Keep APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: PigInspection-v2.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Pig Inspection v2.0.${{ github.run_number }}
          body: |
            Download the .apk below on the phone and open it to install or update.
            Built from: ${{ github.event.head_commit.message }}
          files: out/*.apk
